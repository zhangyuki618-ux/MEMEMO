function modal(type){let body='';if(type==='privacy')body=`<span class="eyebrow">YOUR MEMORIES BELONG TO YOU</span><h2>A little privacy notice.</h2><p>Your moments are personal. MEMEMO has no public feed, and we never sell your journal or use your memories for advertising.</p><p>Your nickname and email make your space yours. Photos, notes and scores help you revisit your memories. You choose what to keep, edit or delete. You can export your collection in Settings and protect your journal with a PIN.</p><p>Questions about your space? Write to <a href="mailto:maomaoout@outlook.com">maomaoout@outlook.com</a>.</p><button class="btn" data-close>Got it</button>`;if(type==='support')body=`${cat()}<h2>A Little Support for MEMEMO</h2><p>MEMEMO is a small independent app made with love. We want to keep it free, simple, and ad-free for everyone. Since we don’t earn money from the app, your support means a lot to us!</p><p>You’re welcome to contact us at <a href="mailto:maomaoout@outlook.com">maomaoout@outlook.com</a>.</p><p>Thank you for helping us keep MEMEMO going ♡</p><a class="btn" href="mailto:maomaoout@outlook.com?subject=A%20little%20support%20for%20MEMEMO">Contact us</a><button class="btn outline" data-close>Maybe later</button>`;if(type==='delete')body=`<h2>Let this moment go?</h2><p>You can undo this from the confirmation that appears next.</p><button class="btn coral" data-action="delete">Delete moment</button><button class="btn outline" data-close>Keep it</button>`;if(type==='profile')body=`<span class="eyebrow">A LITTLE MORE YOU</span><h2>What should we call you?</h2><form id="profile-form" class="form"><label>Nickname<input name="name" maxlength="30" value="${esc(state.name)}" required></label><button class="btn coral">Save nickname</button></form>`;$('#modal').innerHTML=`<div class="modal-backdrop" data-backdrop><section class="modal-card fade" role="dialog" aria-modal="true" aria-label="${type==='privacy'?'Privacy notice':type==='support'?'Support MEMEMO':type==='delete'?'Delete moment':'Edit profile'}"><button class="round modal-close" data-close aria-label="Close dialog">${icon('close')}</button><div style="clear:both"></div>${body}</section></div>`;$('#modal button')?.focus()}
function syncDraft(){const f=$('#moment-form');if(f){const data=Object.fromEntries(new FormData(f));Object.assign(draft,data);draft.rating=Number(draft.rating)}}let deleted=null;document.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.matches('[data-backdrop]'))$('#modal').innerHTML='';if(!b)return;if(b.dataset.go){if(screen==='editor')syncDraft();go(b.dataset.go)}if(b.dataset.modal)modal(b.dataset.modal);if(b.hasAttribute('data-close'))$('#modal').innerHTML='';if(b.dataset.day){selectedDate=b.dataset.day;go('day')}if(b.dataset.entry){selectedId=b.dataset.entry;selectedDate=state.entries.find(x=>x.id===selectedId).date;go('detail')}if(b.dataset.month){month=new Date(month.getFullYear(),month.getMonth()+Number(b.dataset.month),1);render()}if(b.dataset.mood){syncDraft();draft.mood=Number(b.dataset.mood);document.querySelectorAll('[data-mood]').forEach(el=>{el.classList.toggle('active',Number(el.dataset.mood)===draft.mood);el.setAttribute('aria-pressed',String(Number(el.dataset.mood)===draft.mood))});$('#mood-label').textContent=moodNames[draft.mood]}if(b.dataset.filter){filter=b.dataset.filter;go('moments')}if(b.dataset.toggle){if(b.dataset.toggle==='lock'){openPinSettings()}else{state.settings[b.dataset.toggle]=!state.settings[b.dataset.toggle];persist();render()}}if(b.dataset.price){document.querySelectorAll('[data-price]').forEach(x=>x.classList.toggle('selected',x===b))}const action=b.dataset.action;if(action==='past'){selectedDate=localDate(today);setDraft();$('#moment-form input[name=\"date\"]')?.focus()}if(action==='new')setDraft();if(action==='today'){selectedDate=localDate(today);setDraft()}if(action==='edit')setDraft(state.entries.find(x=>x.id===selectedId));if(action==='upload'||action==='camera'){syncDraft();const p=$('#photo-input');p.value='';if(action==='camera')p.setAttribute('capture','environment');else p.removeAttribute('capture');p.click()}if(action==='remove-photo'){syncDraft();draft.photo='';draft.art='';render()}if(action==='support'){$('#modal').innerHTML='';toast('Thank you for the little love. ♡')}if(action==='delete'){deleted=state.entries.find(x=>x.id===selectedId);state.entries=state.entries.filter(x=>x.id!==selectedId);persist();$('#modal').innerHTML=`<div class="modal-backdrop"><section class="modal-card" role="dialog" aria-modal="true" aria-label="Moment deleted"><h2>Moment removed.</h2><p>Changed your mind? You can restore it now.</p><button class="btn coral" data-action="undo">Undo deletion</button><button class="btn outline" data-action="finish-delete">Back to this day</button></section></div>`;}if(action==='undo'&&deleted){state.entries.push(deleted);deleted=null;persist();$('#modal').innerHTML='';go('day');toast('Your little moment is back.')}if(action==='finish-delete'){$('#modal').innerHTML='';go('day')}if(action==='export'){const blob=new Blob([JSON.stringify({app:'MEMEMO',exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mememo-my-little-moments.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Your little collection is ready to download.')}});
document.addEventListener('submit',e=>{if(e.target.id==='signup'){e.preventDefault();state.name=new FormData(e.target).get('nickname').trim()||'Friend';state.email=new FormData(e.target).get('email').trim();persist();go('home');toast('Welcome to your little space.')}if(e.target.id==='profile-form'){e.preventDefault();state.name=new FormData(e.target).get('name').trim()||'Friend';persist();$('#modal').innerHTML='';go('profile');toast('A little more you.')}if(e.target.id==='moment-form'){e.preventDefault();syncDraft();if(!draft.title.trim()){toast('Give your little moment a name.');return}const item={...draft,id:draft.id||'m'+Date.now(),title:draft.title.trim()},i=state.entries.findIndex(x=>x.id===item.id);if(i>=0)state.entries[i]=item;else state.entries.push(item);selectedId=item.id;selectedDate=item.date;persist();go('detail');toast('A little moment, safely kept.')}});document.addEventListener('input',e=>{if(e.target.name==='rating'){draft.rating=Number(e.target.value);draft.mood=Math.max(0,Math.min(4,Math.round(draft.rating)-1));$('#rating-value').textContent=draft.rating.toFixed(1);$('#editor-face').innerHTML=face(draft.rating);$('#score-face').innerHTML=face(draft.rating)}if(e.target.id==='search'){query=e.target.value;const entries=state.entries.filter(x=>(filter==='All moments'||x.category===filter)&&(x.title+' '+x.note).toLowerCase().includes(query.toLowerCase()));$('#results').innerHTML=entries.map(memory).join('')||'<p class="muted">No little moments found. Try another search.</p>'}});$('#photo-input').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Please choose an image.');return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const canvas=document.createElement('canvas'),ratio=Math.min(1,900/im.width,900/im.height);canvas.width=im.width*ratio;canvas.height=im.height*ratio;canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);draft.photo=canvas.toDataURL('image/jpeg',.78);draft.art='';render()};im.onerror=()=>toast('This image format could not be opened. Try JPG or PNG.');im.src=reader.result};reader.readAsDataURL(f)});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML=''});function lockPage(){return `<main class="welcome locked"><div class="opening-identity">${cat('hero-cat')}<h1 class="entry-title">MEMEMO</h1><p class="tagline">Your little space, just for you.</p></div><form id="unlock-form" class="form pin-form"><label>Your PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required aria-label="Four-digit PIN"></label><button class="btn">Unlock</button></form></main>`}async function pinDigest(pin){const data=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('MEMEMO:'+pin));return Array.from(new Uint8Array(data),b=>b.toString(16).padStart(2,'0')).join('')}function openPinSettings(){$('#modal').innerHTML=`<div class="modal-backdrop"><section class="modal-card" role="dialog" aria-modal="true" aria-label="App lock"><button class="round modal-close" data-close aria-label="Close">${icon('close')}</button><h2>${state.settings.lock?'Turn off app lock':'Set your app PIN'}</h2><p>${state.settings.lock?'Enter your current PIN to turn off app lock.':'Choose four digits to keep your little space private. Keep your PIN safe.'}</p><form id="pin-settings-form" class="form"><label>Four-digit PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required autocomplete="off"></label>${state.settings.lock?'':'<label>Confirm PIN<input name="confirm" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required autocomplete="off"></label>'}<button class="btn">${state.settings.lock?'Turn off lock':'Save PIN'}</button></form></section></div>`}document.addEventListener('submit',async e=>{if(!['unlock-form','pin-settings-form'].includes(e.target.id))return;e.preventDefault();const data=new FormData(e.target),pin=data.get('pin');if(!/^[0-9]{4}$/.test(pin)){toast('Please enter four digits.');return}const digest=await pinDigest(pin);if(e.target.id==='unlock-form'){if(digest!==state.lockHash){toast('That PIN doesn’t match. Try again.');return}unlocked=true;go('home');return}if(state.settings.lock){if(digest!==state.lockHash){toast('That PIN doesn’t match. Try again.');return}state.settings.lock=false;state.lockHash=null;toast('App lock is off.')}else{if(pin!==data.get('confirm')){toast('Your PINs don’t match.');return}state.lockHash=digest;state.settings.lock=true;unlocked=true;toast('Your PIN is saved.')}persist();$('#modal').innerHTML='';render()});render();

</script></body></html>
